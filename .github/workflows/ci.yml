name: CI - Control de Inventario

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código fuente
        uses: actions/checkout@v4

      - name: Configurar entorno de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verificar ejecución del pipeline CI
        run: |
          echo "Pipeline de CI ejecutado correctamente para Farmacia El Descuento"
          python --version